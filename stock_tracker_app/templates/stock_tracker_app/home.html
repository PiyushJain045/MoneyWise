{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker | Financial Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2962ff;
            --dark-color: #263238;
            --light-color: #f5f7fa;
            --accent-color: #00c853;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar {
            background-color: white;
            box-shadow: var(--card-shadow);
            padding: 1rem 2rem;
        }
        
        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-links {
            display: flex;
            gap: 1.5rem;
        }
        
        .nav-link {
            color: var(--dark-color);
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: var(--primary-color);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            width: 100%;
        }
        
        .search-container {
            width: 100%;
            max-width: 800px;
        }
        
        .search-card {
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .search-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--dark-color);
            font-weight: 600;
        }
        
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-label {
            font-weight: 500;
            color: var(--dark-color);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(41, 98, 255, 0.2);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-primary:hover {
            background-color: #1a4fc8;
        }
        
        footer {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .footer-text {
            margin-bottom: 1rem;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .social-link {
            color: white;
            font-size: 1.25rem;
            transition: color 0.3s;
        }
        
        .social-link:hover {
            color: var(--accent-color);
        }
        
        .youtube-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: #ff0000;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .youtube-btn:hover {
            transform: translateY(-3px);
            color: white;
        }
        
        @media (max-width: 768px) {
            .navbar-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-links {
                width: 100%;
                justify-content: center;
            }
            
            .search-card {
                padding: 1.5rem;
            }
            
            .youtube-btn {
                bottom: 1rem;
                right: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="{% url 'dashboard' %}" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Stock Tracker</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'st_allstocks' %}" class="nav-link">
                    <i class="fas fa-briefcase"></i>
                    <span>My Stocks</span>
                </a>
                <a href="{% url 'st_stocknews' %}" class="nav-link">
                    <i class="fas fa-newspaper"></i>
                    <span>News</span>
                </a>
            </div>
        </div>
    </nav>


<main class="main-content">
    <div class="search-container">
        <div class="search-card">
            <h3 class="search-title">Track Stocks & Companies</h3>

    <div class="search-box">  
        <form action="{% url 'st_homepage' %}" method="post" class="search-form"> 
        {% csrf_token %}   
            <div class="form-group"> 

                <label for="id_entered_stock" class="form-label">Stock Symbol</label> 
                {{ form.entered_stock }}           
                <label for="id_entered_company" class="form-label">Company Name</label>
                {{ form.entered_company }}

                <button class="btn-search btn-primary"><i class="fas fa-search"></i></button>
            </div>
        </form>
    </div>

</div>
</div>
</main>    
    
    <footer>
        <div class="footer-content">
            <p class="footer-text">
                Created with <i class="fas fa-heart" style="color: #ff5252;"></i> by MoneyWise
            </p>
            <div class="social-links">
                <a href="https://www.instagram.com/ahmadbassamemran/" target="_blank" class="social-link">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.linkedin.com/in/ahmademarn/" target="_blank" class="social-link">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://codepen.io/ahmadbassamemran/" target="_blank" class="social-link">
                    <i class="fab fa-codepen"></i>
                </a>
                <a href="https://dev.to/ahmadbassamemran" target="_blank" class="social-link">
                    <i class="fab fa-dev"></i>
                </a>
                <a href="https://twitter.com/ahmadbassamemra" target="_blank" class="social-link">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>
        </div>
    </footer>
    
    <a href="https://www.youtube.com/AhmadEmran?sub_confirmation=1" target="_blank" class="youtube-btn">
        <span>Watch on YouTube</span>
        <i class="fab fa-youtube"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'home.js' %}"></script>
</body>
</html>
